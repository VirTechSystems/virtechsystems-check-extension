name: Build and publish rules

on:
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 5 * * *" # nightly upstream sync (UTC)
  workflow_dispatch:

# Nothing in this workflow uses GITHUB_TOKEN for writes. Publishing pushes with
# a deploy key (environment secret) that is the only actor allowed to update
# the `published` branch.
permissions:
  contents: read

concurrency:
  group: publish-rules
  cancel-in-progress: false

jobs:
  build-publish:
    # Never publish from forks or from any ref other than main.
    if: github.repository == 'VirTechSystems/virtechsystems-check-extension' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The deploy key lives in this environment, which only main may use, so a
    # workflow pushed on any other branch cannot read it.
    environment: publish
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Build
        run: node scripts/build.js

      - name: Validate
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && printf '%s' "$COMMIT_MSG" | grep -qF '[size-override]'; then
            echo "[size-override] found in commit message"
            export SIZE_OVERRIDE=1
          fi
          node scripts/validate.js

      - name: Require publish deploy key
        env:
          HAS_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Environment secret PUBLISH_DEPLOY_KEY (environment: publish) is not set. See README 'One-time setup'."
            exit 1
          fi

      - name: Check out repository for publishing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publish
          ssh-key: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          fetch-depth: 1

      - name: Publish to the published branch
        run: |
          set -euo pipefail
          cd publish
          if git ls-remote --exit-code --heads origin published >/dev/null; then
            git fetch --depth=1 origin published
            git checkout -B published FETCH_HEAD
          else
            echo "published branch does not exist yet; creating it"
            git checkout --orphan published
            git rm -rf --quiet --ignore-unmatch .
          fi

          # Skip the commit when only the build timestamp would change.
          if [ -f detection-rules.json ] && node -e '
            const fs = require("fs");
            const strip = (f) => { const j = JSON.parse(fs.readFileSync(f, "utf8"));
              if (j.virtech_build) delete j.virtech_build.build_timestamp; return JSON.stringify(j); };
            process.exit(strip("detection-rules.json") === strip("../dist/detection-rules.json") ? 0 : 1);
          '; then
            echo "Published rules are already up to date; nothing to publish."
            exit 0
          fi

          cp ../dist/detection-rules.json ../dist/BUILD_INFO.json .
          cat > README.md <<'EOF'
          # Published Check detection rules

          Generated by `.github/workflows/build.yml` on `main`. Do not edit this branch.
          Change `overlay/` on `main` through a pull request instead. See the README on `main`.
          EOF

          git config user.name "virtech-rules-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detection-rules.json BUILD_INFO.json README.md
          UPSTREAM=$(node -p 'require("../dist/BUILD_INFO.json").upstream_commit || "unknown"')
          VERSION=$(node -p 'require("../dist/BUILD_INFO.json").upstream_version')
          git commit -m "Publish rules: upstream ${VERSION} @ ${UPSTREAM:0:12}, overlay ${GITHUB_SHA:0:12}" \
                     -m "Trigger: ${GITHUB_EVENT_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin HEAD:refs/heads/published

          {
            echo "### Published"
            echo '```json'
            cat ../dist/BUILD_INFO.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
